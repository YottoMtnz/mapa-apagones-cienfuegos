name: Mapa de Apagones Cienfuegos
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: Modo de lectura
        type: choice
        options: [actualizar, estudio]
        default: actualizar
  push:
    branches: [main]
    paths: ['index.html', 'config.js', 'assets/**', 'scraper/**', 'requirements.txt', '.github/workflows/mapa.yml']
permissions:
  contents: write
concurrency:
  group: mapa-cienfuegos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencias y OCR gratuito en español
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
          python -m pip install -r requirements.txt
      - name: Recuperar lecturas de imágenes
        uses: actions/cache@v4
        with:
          path: .cache/ocr.json
          key: ocr-v4-${{ github.run_id }}
          restore-keys: ocr-v4-
      - name: Pruebas de regresión
        run: python -m unittest discover -s tests -v
      - name: Leer canal de Cienfuegos
        id: lectura
        continue-on-error: true
        run: python scraper/actualizar.py
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          MODO_ESTUDIO: ${{ inputs.modo == 'estudio' && '1' || '' }}
          MAX_OCR_POR_CICLO: '16'
          MAX_MENSAJES: '200'
      - name: Conservar estudio íntegro del canal
        if: inputs.modo == 'estudio' && steps.lectura.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: estudio-cienfuegos
          path: data/estudio_canales.json
          retention-days: 7
      - name: Guardar cambios de estado
        run: |
          git config user.name MapaBot
          git config user.email mapabot@users.noreply.github.com
          git add data/estado_cienfuegos.json
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar estado Cienfuegos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preparar web pública
        run: python scraper/preparar_web.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Registrar fallo de lectura sin ocultarlo
        if: steps.lectura.outcome == 'failure'
        run: echo '::warning::La lectura del canal falló. El mapa mostrará el aviso y los datos sin confirmar.'
    outputs:
      lectura: ${{ steps.lectura.outcome }}
  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Señalar error del canal
        if: needs.actualizar.outputs.lectura == 'failure'
        run: exit 1
