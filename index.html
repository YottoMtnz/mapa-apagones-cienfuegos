<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Apagones — Cuba</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b0f1a; --panel:rgba(13,18,32,.94); --borde:#2dd4bf2e;
    --teal:#5eead4; --rojo:#f87171; --naranja:#fbbf24; --verde:#4ade80;
    --gris:#9aa4b8; --gris2:#6b7280;
  }
  body{font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:#e8ecf4}
  #map{height:100vh;width:100%;background:#0b0f1a}
  .panel{position:fixed;top:12px;left:12px;z-index:1000;background:var(--panel);
    border:1px solid var(--borde);border-radius:16px;padding:16px;max-width:340px;
    backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
  .panel h1{font-size:19px;color:var(--teal);margin-bottom:2px;display:flex;align-items:center;gap:8px}
  .panel .sub{font-size:12px;color:var(--gris);margin-bottom:12px}
  .provsel{width:100%;margin-bottom:12px;background:#141b2e;color:#e8ecf4;
    border:1px solid #2dd4bf44;border-radius:10px;padding:10px;font-size:14px;cursor:pointer}
  .provsel:focus{outline:none;border-color:var(--teal)}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{flex:1;text-align:center;padding:8px 4px;border-radius:10px;font-size:12px;font-weight:600;
    cursor:pointer;background:#141b2e;color:var(--gris);border:1px solid transparent;transition:.2s}
  .tab.activo{color:#0b0f1a}
  .tab[data-tab="ahora"].activo{background:var(--rojo)}
  .tab[data-tab="programados"].activo{background:var(--naranja)}
  .tab[data-tab="todos"].activo{background:var(--teal)}
  .stats{display:flex;gap:8px;margin-bottom:10px}
  .stat{flex:1;background:#141b2e;border-radius:12px;padding:10px 6px;text-align:center;border:1px solid #ffffff08}
  .stat b{font-size:22px;display:block;line-height:1.2}
  .stat span{font-size:10px;color:var(--gris);text-transform:uppercase;letter-spacing:.5px}
  .stat.red b{color:var(--rojo)}.stat.orange b{color:var(--naranja)}.stat.green b{color:var(--verde)}
  .leyenda{display:flex;gap:12px;margin-bottom:10px;font-size:11px;color:var(--gris);flex-wrap:wrap}
  .leyenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
  .updated{font-size:11px;color:var(--gris2);line-height:1.5}
  .credits{font-size:11px;color:var(--gris2);margin-top:10px;padding-top:10px;border-top:1px solid #ffffff10}
  .credits a{color:var(--teal);text-decoration:none}
  .dot{border-radius:50%;border:2px solid #fff3;box-shadow:0 0 8px rgba(0,0,0,.5)}
  .dot.red{background:#ef4444;animation:blink 1.2s infinite}
  .dot.orange{background:#f59e0b;animation:blink 2.2s infinite}
  .dot.green{background:#22c55e}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  .leaflet-popup-content{font-size:13px;line-height:1.6;min-width:180px}
  .leaflet-popup-content b{color:#0b0f1a}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#0b0f1a;margin-bottom:4px}
  .badge.red{background:var(--rojo)}.badge.orange{background:var(--naranja)}.badge.green{background:var(--verde)}
  @media(max-width:600px){
    .panel{max-width:calc(100vw - 24px);padding:12px}
    .panel h1{font-size:16px}
    .stat b{font-size:18px}
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>⚡ Mapa de Apagones</h1>
  <div class="sub">Cuba — monitoreo en vivo</div>
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <select class="provsel" id="provSel" style="flex:1;margin-bottom:0"></select>
  </div>
  <div class="tabs">
    <div class="tab activo" data-tab="todos">Todos</div>
    <div class="tab" data-tab="ahora">Sin servicio</div>
    <div class="tab" data-tab="programados">Programados</div>
  </div>
  <div class="stats">
    <div class="stat red"><b id="cAfect">–</b><span>Sin servicio</span></div>
    <div class="stat orange"><b id="cProg">–</b><span>Programados</span></div>
    <div class="stat green"><b id="cOk">–</b><span>Con servicio</span></div>
  </div>
  <div class="leyenda">
    <span><i style="background:#ef4444"></i>Sin servicio</span>
    <span><i style="background:#f59e0b"></i>Programado</span>
    <span><i style="background:#22c55e"></i>Con servicio</span>
  </div>
  <div class="updated" id="upd">Cargando…</div>
  <div class="credits">
    Desarrollado por <a href="https://github.com/YottoMtnz" target="_blank">Fraudy Martinez Madruga</a>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PROVINCIAS = {
  "cienfuegos":      {nombre:"Cienfuegos",       centro:[22.15,-80.45], zoom:10, activa:true},
  "matanzas":        {nombre:"Matanzas",         centro:[23.05,-81.58], zoom:10, activa:true},
  "villa-clara":     {nombre:"Villa Clara",      centro:[22.42,-79.90], zoom:10, activa:true},
  "sancti-spiritus": {nombre:"Sancti Spíritus",  centro:[21.93,-79.44], zoom:10, activa:true},
  "ciego-de-avila":  {nombre:"Ciego de Ávila",   centro:[21.85,-78.76], zoom:10, activa:true},
  "camaguey":        {nombre:"Camagüey",         centro:[21.38,-77.91], zoom:10, activa:true},
  "las-tunas":       {nombre:"Las Tunas",        centro:[20.96,-76.95], zoom:10, activa:true},
  "holguin":         {nombre:"Holguín",          centro:[20.89,-76.26], zoom:10, activa:true},
  "granma":          {nombre:"Granma",           centro:[20.38,-76.64], zoom:10, activa:true},
  "santiago-de-cuba":{nombre:"Santiago de Cuba", centro:[20.02,-75.83], zoom:10, activa:true},
  "artemisa":        {nombre:"Artemisa",         centro:[22.82,-82.76], zoom:10, activa:true},
  "mayabeque":       {nombre:"Mayabeque",        centro:[22.97,-82.15], zoom:10, activa:true},
  "pinar-del-rio":   {nombre:"Pinar del Río",    centro:[22.42,-83.70], zoom:10, activa:false},
  "la-habana":       {nombre:"La Habana",        centro:[23.14,-82.37], zoom:10, activa:true},
  "guantanamo":      {nombre:"Guantánamo",       centro:[20.14,-75.21], zoom:10, activa:false},
};

const map = L.map('map',{zoomControl:false}).setView([21.5,-79.0], 6);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap', maxZoom:19
}).addTo(map);
let layerGroup = L.layerGroup().addTo(map);
let filtroActual = 'todos';
let datosCache = {};

const sel = document.getElementById('provSel');
for(const [id,p] of Object.entries(PROVINCIAS)){
  const o = document.createElement('option');
  o.value = id; o.textContent = p.nombre + (p.activa ? '' : ' (próximamente)');
  if(id==='cienfuegos') o.selected = true;
  sel.appendChild(o);
}
sel.addEventListener('change', ()=>cargar(sel.value, true));

let miPos = null;
// Botón "mi ubicación" flotante a la derecha del panel
const btnU = document.createElement('button');
btnU.id = 'btnUbic';
btnU.title = 'Mi ubicación';
btnU.innerHTML = '◎';
btnU.style.cssText = 'position:fixed;top:12px;right:12px;z-index:500;width:44px;height:44px;border-radius:12px;border:1px solid #2dd4bf;background:#0f172a;color:#5eead4;font-size:22px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5)';
document.body.appendChild(btnU);
function irAMiPos(){
  const ir = (lat,lng)=>{ miPos=[lat,lng]; moviendoPorCodigo=true; map.flyTo(miPos,12,{duration:1}); setTimeout(()=>moviendoPorCodigo=false,1100); };
  if(miPos) ir(miPos[0], miPos[1]);
  else if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>ir(p.coords.latitude,p.coords.longitude), ()=>{}, {timeout:10000});
}
btnU.addEventListener('click', irAMiPos);
btnU.addEventListener('touchstart', (e)=>{ e.preventDefault(); irAMiPos(); }, {passive:false});

let moviendoPorCodigo = false;
// Si el usuario mueve el mapa manual, detectar la provincia del centro
map.on('moveend', ()=>{
  if(moviendoPorCodigo) return;
  const c = map.getCenter();
  let mejor=null, mejorD=1e9;
  for(const [id,p] of Object.entries(PROVINCIAS)){
    const d=distancia(c.lat,c.lng,p.centro[0],p.centro[1]);
    if(d<mejorD){ mejorD=d; mejor=id; }
  }
  if(mejor && mejor!==sel.value && mejorD<250){
    sel.value=mejor;
    cargar(mejor, false);
  }
});

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('activo'));
    t.classList.add('activo');
    filtroActual = t.dataset.tab;
    renderizar();
  });
});

async function cargar(prov, mover=true){
  const p = PROVINCIAS[prov];
  document.getElementById('upd').textContent = 'Cargando…';
  layerGroup.clearLayers();
  try{
    const [circ, est] = await Promise.all([
      fetch(`data/circuitos_${prov}.json`).then(r=>r.json()),
      fetch(`data/estado_${prov}.json`).then(r=>r.json()).catch(()=>({afectados:{},programados:{}}))
    ]);
    datosCache = {circ, est};
    renderizar();
    const f = est.actualizado ? new Date(est.actualizado).toLocaleString('es') : '—';
    document.getElementById('upd').dataset.full = `Actualizado: ${f}`;
    actualizarTexto();
    if(mover){ moviendoPorCodigo=true; map.flyTo(p.centro, p.zoom, {duration:1}); setTimeout(()=>moviendoPorCodigo=false, 1100); }
  }catch(e){
    document.getElementById('upd').textContent = 'Datos de ' + p.nombre + ' próximamente.';
    document.getElementById('cAfect').textContent = '–';
    document.getElementById('cProg').textContent = '–';
    document.getElementById('cOk').textContent = '–';
    datosCache = {};
    if(mover){ moviendoPorCodigo=true; map.flyTo(p.centro, p.zoom, {duration:1}); setTimeout(()=>moviendoPorCodigo=false, 1100); }
  }
}

function renderizar(){
  layerGroup.clearLayers();
  const {circ={}, est={}} = datosCache;
  if(!Object.keys(circ).length) return;
  const afectados = est.afectados || {};
  const programados = est.programados || {};
  let nAfect=0, nProg=0, nOk=0;
  const porMun = {};
  for(const [id, c] of Object.entries(circ)){
    const esAfect = !!afectados[id];
    const esProg = !esAfect && !!programados[id];
    if(esAfect) nAfect++;
    else if(esProg) nProg++;
    else nOk++;
    // Filtro por pestaña
    if(filtroActual==='ahora' && !esAfect) continue;
    if(filtroActual==='programados' && !esProg) continue;
    if(esAfect) porMun[c.municipio]=(porMun[c.municipio]||0)+1;
    const color = esAfect ? 'red' : (esProg ? 'orange' : 'green');
    const icon = L.divIcon({className:'', html:`<div class="dot ${color}" style="width:18px;height:18px${c.aproximado?';opacity:.45':''}"></div>`, iconSize:[18,18]});
    const lugares = (c.lugares||[]).join(', ');
    const badge = esAfect ? '<span class="badge red">SIN SERVICIO</span>'
                : esProg ? '<span class="badge orange">PROGRAMADO</span>'
                : '<span class="badge green">CON SERVICIO</span>';
    const aprox = c.aproximado ? '<br><i style="color:#f59e0b">📍 Ubicación aproximada</i>' : '';
    const zonas = esAfect ? afectados[id] : (esProg ? programados[id] : null);
    const detalle = (zonas && zonas.length) ? `<br><b>Zonas:</b> ${zonas.join(', ')}` : '';
    L.marker([c.lat, c.lng], {icon}).addTo(layerGroup)
      .bindPopup(`${badge}<br><b>Circuito ${id}</b><br>${lugares}${c.municipio?`<br><i>${c.municipio}</i>`:''}${aprox}${detalle}`);
  }
  document.getElementById('cAfect').textContent = nAfect;
  document.getElementById('cProg').textContent = nProg;
  document.getElementById('cOk').textContent = nOk;
  actualizarTexto(porMun);
}

function actualizarTexto(porMun){
  const base = document.getElementById('upd').dataset.full || '';
  let munTxt = porMun ? Object.entries(porMun).map(([m,n])=>`${m}: ${n}`).join(' · ') : '';
  document.getElementById('upd').textContent = base + (munTxt ? ` | ${munTxt}` : '');
}

cargar('cienfuegos', false);
map.flyTo([22.15,-80.45], 10, {duration:1.5});
setInterval(()=>cargar(sel.value, false), 5*60*1000);

// Geolocalización: marca al usuario y auto-selecciona su provincia
function distancia(lat1,lon1,lat2,lon2){
  const R=6371, dLa=(lat2-lat1)*Math.PI/180, dLo=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
const userIcon = L.divIcon({className:'', html:'<div style="width:20px;height:20px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 10px #3b82f6"></div>', iconSize:[20,20]});
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    miPos = [lat, lng];
    L.marker([lat,lng],{icon:userIcon}).addTo(map).bindPopup("📍 Estás aquí").openPopup();
    let mejor=null, mejorD=1e9;
    for(const [id,p] of Object.entries(PROVINCIAS)){
      const d=distancia(lat,lng,p.centro[0],p.centro[1]);
      if(d<mejorD){ mejorD=d; mejor=id; }
    }
    // Solo auto-selecciona si está razonablemente cerca (250 km) y la provincia está activa
    if(mejor && mejorD<250 && PROVINCIAS[mejor].activa){
      sel.value=mejor;
      cargar(mejor, true);
    } else {
      map.flyTo([lat,lng], 10, {duration:1.5});
    }
  }, ()=>{}, {timeout:10000});
}
</script>
</body>
</html>
