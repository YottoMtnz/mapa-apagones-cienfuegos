<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Mapa de Apagones</title>
<style>
  body{background:#0b0f1a;color:#e2e8f0;font-family:system-ui;margin:0;padding:20px}
  .box{max-width:600px;margin:40px auto;background:#1e293b;border-radius:12px;padding:24px}
  h2{color:#5eead4;margin-top:0}
  input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#0b0f1a;color:#fff;box-sizing:border-box}
  button{background:#5eead4;color:#0b0f1a;border:none;border-radius:8px;padding:10px 20px;font-weight:bold;cursor:pointer;margin:4px}
  button.rechazar{background:#ef4444;color:#fff}
  .corr{background:#0b0f1a;border:1px solid #334155;border-radius:8px;padding:12px;margin:10px 0}
  .corr b{color:#5eead4}
  #login{display:block}
  #panel{display:none}
</style>
</head>
<body>
<div class="box" id="login">
  <h2>🔐 Admin</h2>
  <input type="password" id="pass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')entrar()">
  <button onclick="entrar()">Entrar</button>
  <p id="err" style="color:#ef4444"></p>
</div>
<div class="box" id="panel">
  <h2>📍 Correcciones pendientes</h2>
  <button onclick="cargar().catch(e=>alert(e.message))">🔄 Recargar</button>
  <div id="lista"></div>
</div>
<script src="config.js"></script>
<script>
let clave='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,extra={}){
  const url=window.MAPA_CONFIG?.adminUrl;
  if(!url||!url.startsWith('https://script.google.com/'))throw new Error('Configura adminUrl en config.js y ADMIN_TOKEN en las propiedades del servidor.');
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:clave,...extra})});
  if(!r.ok)throw new Error('No se pudo contactar con el servidor');
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Acceso denegado');return j;
}
async function entrar(){clave=$('pass').value;try{await cargar();$('pass').value='';$('login').style.display='none';$('panel').style.display='block';}catch(e){clave='';$('err').textContent=e.message;}}
async function cargar(){
  const r=await api('pendientes'),lista=$('lista');lista.textContent='';
  if(!r.correcciones.length){lista.textContent='No hay correcciones pendientes.';return;}
  for(const c of r.correcciones){
    const div=document.createElement('div');div.className='corr';
    div.innerHTML=`<b>${esc(c.lugar)}</b> (${esc(c.prov)})<br>Circuito: ${esc(c.circuito)}<br>${esc(c.lat)}, ${esc(c.lng)}<br><small>${esc(c.fecha)}</small><br>`;
    for(const action of ['aprobar','rechazar']){const b=document.createElement('button');b.textContent=action;b.addEventListener('click',()=>decidir(c.fila,action));div.appendChild(b);}lista.appendChild(div);
  }
}
async function decidir(fila,action){if(!confirm('¿'+action+' esta corrección?'))return;try{await api(action,{fila});await cargar();}catch(e){alert(e.message);}}
</script>
</body></html>
